name: Sync main into directive branch

on:
  push:
    branches: [feat/persistent-unit-directives]
    paths:
      - '.github/workflows/sync-main-into-directive.yml'

permissions:
  contents: write

concurrency:
  group: sync-main-into-directive
  cancel-in-progress: false

jobs:
  merge-main:
    if: github.repository == 'magiccodingman/smacx-agent' && github.ref == 'refs/heads/feat/persistent-unit-directives'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/persistent-unit-directives
          fetch-depth: 0
      - name: Merge latest main without publishing partial state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-ff --no-commit origin/main; then
            echo 'MERGE_CONFLICTS_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'MERGE_CONFLICTS_END'
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate merged tree
        run: |
          python -m pip install 'mcp==2.0.0'
          python -m compileall -q src harness
          python scripts/unit_directive_validation.py --output runtime/directive-validation
          git diff --check
      - name: Publish merge and remove one-time helper
        run: |
          git rm .github/workflows/sync-main-into-directive.yml
          git commit -m 'Merge main into feat/persistent-unit-directives'
          git push origin HEAD:refs/heads/feat/persistent-unit-directives
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-sync-directive-validation-${{ github.run_id }}
          path: runtime/directive-validation/
          retention-days: 7
          if-no-files-found: ignore
