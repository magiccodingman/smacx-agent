name: Sync main into directive branch

on:
  push:
    branches: [feat/persistent-unit-directives]
    paths:
      - '.github/workflows/sync-main-into-directive.yml'

permissions:
  contents: write

concurrency:
  group: sync-main-into-directive
  cancel-in-progress: true

jobs:
  merge-main:
    if: github.repository == 'magiccodingman/smacx-agent' && github.ref == 'refs/heads/feat/persistent-unit-directives'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/persistent-unit-directives
          fetch-depth: 0
      - name: Merge latest main and resolve the reviewed documentation collision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Merge conflicts: %s\n' "${conflicts[*]}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != 'docs/testing.md' ]; then
              echo 'Unexpected conflict set; refusing an automatic resolution.'
              exit 1
            fi
            git checkout --ours docs/testing.md
            python - <<'PY'
          from pathlib import Path

          path = Path('docs/testing.md')
          text = path.read_text()
          old = "this handle-recovery path. `hermes_complementary_results_test.py` checks that the"
          new = (
              "this handle-recovery path. The test also pins `choice-01` as the first bounded\n"
              "frame-local opaque handle; the paired decision cache still owns every private\n"
              "native argument and all expiry, scope, revision, one-use and replay guards.\n"
              "`hermes_complementary_results_test.py` checks that the"
          )
          if old not in text:
              raise SystemExit('Expected decision-handle documentation anchor was not found.')
          text = text.replace(old, new, 1)
          section = """

          ### Multiplayer native Explore

          `SMACX_TEST_AUTO_EXPLORE_ONLY=1 PYTHONPATH=src SMACX_RUNTIME_ROOT=\"$PWD/runtime\" python3 scripts/lan_two_client_join_test.py`
          starts two isolated DirectPlay clients, assigns native Explore to a current ready
          combat unit, requires both vehicle records to carry `VSTATE_EXPLORE`, verifies
          the unit exposes only activation, cancels the order, and requires both peers to
          clear it. The broader ungated suite repeats the same assertions before its
          hold/sentry checks. The focused mode proves native state synchronization and
          cancellation; it does not prove that a sovereign will choose Explore or that the
          engine's automated path is strategically optimal.
          """
          if '### Multiplayer native Explore' not in text:
              text = text.rstrip() + section
          path.write_text(text.rstrip() + '\n')
          PY
            git add docs/testing.md
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'Unresolved merge conflicts remain.'
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate merged tree
        run: |
          python -m pip install 'mcp==2.0.0'
          python -m compileall -q src harness
          python scripts/unit_directive_validation.py --output runtime/directive-validation
          git diff --check
      - name: Publish merge and remove one-time helper
        run: |
          git rm .github/workflows/sync-main-into-directive.yml
          git commit -m 'Merge main into feat/persistent-unit-directives'
          git push origin HEAD:refs/heads/feat/persistent-unit-directives
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-sync-directive-validation-${{ github.run_id }}
          path: runtime/directive-validation/
          retention-days: 7
          if-no-files-found: ignore
