name: Publish reviewed directive source

on:
  push:
    branches: [feat/persistent-unit-directives]
    paths:
      - '.directive-patch/**'
      - '.github/workflows/directive-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'magiccodingman/smacx-agent' && github.ref == 'refs/heads/feat/persistent-unit-directives'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Decode and verify reviewed source patch
        run: |
          python - <<'PY'
          import base64, bz2, hashlib
          from pathlib import Path
          parts = sorted(Path('.directive-patch').glob('part-*'))
          assert len(parts) == 6, 'Incomplete patch transport'
          packed = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '87780f1593860e6e8871b70bd973ceaaf0bb98059c831a84bb1b749aa76b01d4', 'Patch checksum mismatch'
          Path('/tmp/unit-directives.patch').write_bytes(bz2.decompress(packed))
          PY
          git apply --check /tmp/unit-directives.patch
          git apply /tmp/unit-directives.patch
          git diff --check
      - name: Install repository-pinned MCP test dependency
        run: python -m pip install 'mcp==2.0.0'
      - name: Validate source and all affected contracts
        run: |
          python -m compileall -q src harness
          python scripts/unit_directive_validation.py --output runtime/directive-validation
      - name: Commit validated feature and remove transport helpers
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/feat/persistent-unit-directives | cut -f1)" = "$EXPECTED_SHA"
          git add src harness scripts docs control_center/Dockerfile
          git rm -r .directive-patch .github/workflows/directive-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add persistent supervised unit directives and contract tests'
          git push origin HEAD:refs/heads/feat/persistent-unit-directives
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-directive-publish-validation
          path: runtime/directive-validation/
          retention-days: 7
          if-no-files-found: ignore
