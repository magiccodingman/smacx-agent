name: Unit directive contracts

on:
  push:
    branches: [main, feat/persistent-unit-directives]
    paths:
      - 'src/**'
      - 'harness/**'
      - 'scripts/**'
      - 'control_center/Dockerfile'
      - '.github/workflows/directive-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'harness/**'
      - 'scripts/**'
      - 'control_center/Dockerfile'
      - '.github/workflows/directive-validation.yml'

permissions:
  contents: read

concurrency:
  group: unit-directives-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install repository-pinned MCP dependency
        run: python -m pip install 'mcp==2.0.0'
      - name: Compile Python sources
        run: python -m compileall -q src harness
      - name: Run new directive cases and affected regression suites
        run: python scripts/unit_directive_validation.py --output runtime/directive-validation
      - name: Record tested revision
        if: always()
        run: |
          mkdir -p runtime/directive-validation
          git rev-parse HEAD > runtime/directive-validation/source-commit.txt
      - name: Retain per-suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-directive-validation-${{ github.run_id }}
          path: runtime/directive-validation/
          retention-days: 14
          if-no-files-found: warn
